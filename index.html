<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Meet the Team</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9ec9e8;font-family:system-ui,Segoe UI,sans-serif}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000}
#top{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:18px}
#help{position:absolute;bottom:8px;left:12px;font-size:12px;opacity:.85}
#prompt{position:absolute;left:0;right:0;bottom:170px;text-align:center;font-size:18px;font-weight:600}
#prompt span{background:#000a;padding:6px 14px;border-radius:20px}
#dlg{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,92vw);box-sizing:border-box;display:none;gap:14px;background:#14182add;color:#fff;border:2px solid #fff8;border-radius:12px;padding:14px;text-shadow:none}
#dlg .pic{image-rendering:pixelated;flex:none;width:96px;height:96px;border-radius:8px;object-fit:cover;background:#556;display:flex;align-items:center;justify-content:center;font-size:48px}
#dlg .nm{font-weight:700;font-size:18px}#dlg .rl{font-size:12px;opacity:.7;margin-bottom:6px}
#dlg .tx{font-size:17px;line-height:1.4;min-height:48px}#dlg .nx{text-align:right;font-size:12px;opacity:.7}
.chat{position:absolute;max-width:220px;background:#fffe;color:#222;text-shadow:none;font-size:13px;padding:7px 11px;border-radius:12px;box-shadow:0 2px 8px #0005;opacity:0;transition:opacity .6s}
.chat.show{opacity:1}.chat b{display:block;font-size:11px}
#start{position:fixed;inset:0;background:#000a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center}
#start button{font-size:18px;padding:10px 22px;border:0;border-radius:8px;cursor:pointer}
</style></head><body>
